name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    uses: st0o0/github-workflows/.github/workflows/go-ci.yml@f239350bedc5c262e5e0331f07b3fea666ea2866 # v1.1.0
    with:
      docker-image-name: ran
      # The ci-post-build hook fuzzes every target for 20 seconds.
      unit-timeout-minutes: 25

  commits:
    uses: st0o0/github-workflows/.github/workflows/commitlint.yml@f239350bedc5c262e5e0331f07b3fea666ea2866 # v1.1.0

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: docs
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm run test
        working-directory: docs
      - run: pnpm run build
        working-directory: docs
