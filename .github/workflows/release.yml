name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    uses: st0o0/github-workflows/.github/workflows/release-please.yml@main
    permissions:
      contents: write
      pull-requests: write

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: st0o0/github-workflows/.github/workflows/go-build.yml@main
    with:
      version: ${{ needs.release-please.outputs.version }}
      build-package: ./cmd/ran
      binary-name: ran
      extra-files: 'LICENSE.md'
    permissions:
      contents: read

  docker:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    uses: st0o0/github-workflows/.github/workflows/docker-release.yml@main
    with:
      version: ${{ needs.release-please.outputs.version }}
      image-name: ghcr.io/st0o0/ran
      image-description: "Go honeypot container -- traps and logs unauthorized access attempts"
    permissions:
      contents: read
      packages: write
      id-token: write
