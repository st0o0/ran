name: Security

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: github.event_name != 'schedule'
    uses: st0o0/github-workflows/.github/workflows/security.yml@v1.0.0
    with:
      scan-type: fs
    permissions:
      contents: read
      security-events: write

  image:
    if: github.event_name == 'schedule'
    uses: st0o0/github-workflows/.github/workflows/security.yml@v1.0.0
    permissions:
      contents: read
      security-events: write
