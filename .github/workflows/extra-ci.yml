name: Extra CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-386:
    name: GOARCH=386 build and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Some length checks depend on the size of int.
      - run: GOARCH=386 go build ./...
      - run: GOARCH=386 go vet ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fuzz every target for 20 seconds
        run: |
          set -eu
          failed=0
          targets=$(grep -rhoE '^func Fuzz[A-Za-z0-9_]+' --include='*_test.go' internal | sed 's/^func //' | sort -u)
          for target in $targets; do
            pkg=$(dirname "$(grep -rlE "^func ${target}\(" --include='*_test.go' internal | head -n1)")
            echo "== ${target} (${pkg})"
            # Minimization is disabled: when the fuzztime deadline hits during minimization, go test
            # fails with a bare "context deadline exceeded" even though no input crashed.
            # The deadline can also race with worker shutdown, so a non-zero exit without
            # "Failing input written to" in the output is treated as a spurious timeout.
            set +e
            out=$(go test -run='^$' -fuzz="^${target}\$" -fuzztime=20s -fuzzminimizetime=0 "./${pkg}" 2>&1)
            rc=$?
            set -e
            echo "$out"
            if [ $rc -ne 0 ] && echo "$out" | grep -q 'Failing input written to'; then
              echo "::error::${target} found a crashing input"
              failed=1
            elif [ $rc -ne 0 ]; then
              echo "::warning::${target} exited ${rc} without a crashing input (spurious deadline race)"
            fi
          done
          exit $failed
